name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Pull requests cancel their superseded runs; every main push keeps its own
# group (per SHA) so a later push never cancels an earlier main run.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install locked Oh runtime
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check research ledger and reproduce experiments
        env:
          PEQNP_SNAPSHOT_TESTS_SEPARATE: "1"
        run: bun run check

  # The Oh snapshot suite needs no Rust and its multi-page export/restore test
  # takes most of its time, so it runs beside the main check.
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install locked Oh runtime
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Oh snapshot tests
        run: bun run check:oh:snapshot

  required:
    name: Required
    if: always()
    needs: [check, snapshot]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected job
        env:
          CHECK: ${{ needs.check.result }}
          SNAPSHOT: ${{ needs.snapshot.result }}
        run: |
          set -euo pipefail
          for result in "$CHECK" "$SNAPSHOT"; do
            if [[ "$result" != success ]]; then
              printf 'Unexpected required job result: check=%s snapshot=%s\n' "$CHECK" "$SNAPSHOT"
              exit 1
            fi
          done
